# Omadora: install security updates every day (dnf5-automatic.timer), as
# company compliance requires (fedora/docs/INTUNE.md). Everything else waits
# for `omarchy update`, which also runs Omarchy's migrations and restart
# checks. Packages without security advisories (our COPR, the Hyprland COPR)
# are left alone. Defaults: /usr/share/dnf5/dnf5-plugins/automatic.conf.
[commands]
upgrade_type = security
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
emit_via = stdio
