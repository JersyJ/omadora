name: fedora-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # Which checks this change needs (fedora/bin/ci-changes): a check is
    # skipped only when every changed file is on its list of paths it does not
    # read, so documentation-only changes run nothing.
    runs-on: ubuntu-latest
    outputs:
      static: ${{ steps.decide.outputs.static }}
      resolve: ${{ steps.decide.outputs.resolve }}
      rpm: ${{ steps.decide.outputs.rpm }}
      upstream_tests: ${{ steps.decide.outputs.upstream_tests }}
      any: ${{ steps.decide.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: fedora/bin/ci-changes "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck patch
      - name: Static checks
        run: fedora/tests/static.sh

  resolve:
    # Does Omarchy's package set install on Fedora with only the allowed
    # repositories? Runs in a throwaway Fedora container; installs nothing.
    needs: changes
    if: needs.changes.outputs.resolve == 'true'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install tools
        run: dnf -y -q install git-core
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Resolve the package set
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fedora/tests/resolve.sh

  resolve-optional:
    # The same for the packages Omarchy's optional installers map to, with the
    # on-demand vendor repositories and COPRs added.
    needs: changes
    if: needs.changes.outputs.resolve == 'true'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install tools
        run: dnf -y -q install git-core
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Resolve the optional package set
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fedora/tests/resolve.sh --optional

  rpm:
    # Build omarchy, omarchy-settings and omadora-repos the way COPR does, and
    # install them in a throwaway Fedora container.
    needs: changes
    if: needs.changes.outputs.rpm == 'true'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install tools
        run: dnf -y -q install git-core
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build and install
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fedora/tests/rpm.sh

  upstream-tests:
    # Upstream's own CLI and shell test suites, run against the assembled
    # Fedora tree; deliberate differences are listed in
    # fedora/tests/upstream-expected-failures.txt.
    needs: changes
    if: needs.changes.outputs.upstream_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install tools
        run: dnf -y -q install git-core jq nodejs patch findutils which procps-ng file shadow-utils util-linux python3 python-unversioned-command systemd
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run upstream's tests
        run: |
          # As root, upstream's tests skip much of what they check.
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- fedora/tests/upstream-tests.sh

  copr:
    # After every check passes on a push to main, build in our COPR what the
    # push changed (fedora/bin/copr-build-changed). Needs the COPR_CONFIG
    # secret: the contents of ~/.config/copr from
    # https://copr.fedorainfracloud.org/api/. COPR tokens expire; when this job
    # fails to authenticate, renew the token and update the secret.
    # Runs when no check failed; a check this change did not need is skipped,
    # which counts as passed.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.any == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, static, resolve, resolve-optional, rpm, upstream-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: copr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install copr-cli
        run: pipx install copr-cli
      - name: Build what the push changed
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::notice::The COPR_CONFIG secret is not set; skipping the COPR builds"
            exit 0
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" >~/.config/copr
          chmod 600 ~/.config/copr
          # COPR builds main's tip. When a newer push landed while the checks
          # ran (or this is a re-run), build everything since $BEFORE from
          # there; the newer push's own job then finds its recipes built.
          git fetch -q origin main
          git checkout -q --detach origin/main
          fedora/bin/copr-build-changed "$BEFORE" HEAD
