name: fedora-ci

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck patch
      - name: Static checks
        run: fedora/tests/static.sh
