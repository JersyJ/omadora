name: fedora-sync

# Every second Monday: when upstream's quattro branch has moved past the commit
# pinned in fedora/upstream.lock, sync to its tip on a branch and open a pull
# request. The static check result goes into the PR body; review follows
# fedora/docs/SYNC.md. Run it by hand from the Actions tab at any time.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip odd weeks
        id: week
        run: |
          if [[ $GITHUB_EVENT_NAME == "schedule" ]] && (( 10#$(date +%V) % 2 == 1 )); then
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.week.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - name: Install tools
        if: steps.week.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck patch
      - name: Find upstream's quattro tip
        id: tip
        if: steps.week.outputs.skip != 'true'
        run: |
          git remote add upstream https://github.com/omacom/omarchy.git
          git fetch --quiet --tags upstream quattro
          source fedora/upstream.lock
          tip=$(git rev-parse upstream/quattro)
          short=$(git rev-parse --short "$tip")
          echo "pinned=$UPSTREAM_COMMIT tip=$tip"
          if [[ $tip != "$UPSTREAM_COMMIT" ]] && ! git ls-remote --exit-code origin "refs/heads/sync/$short" >/dev/null; then
            echo "short=$short" >>"$GITHUB_OUTPUT"
          fi
      - name: Sync and open a pull request
        if: steps.tip.outputs.short != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.tip.outputs.short }}
        run: |
          git config user.name "omadora sync"
          git config user.email "sync@users.noreply.github.com"
          git switch -c "sync/$SHORT"
          fedora/bin/sync-upstream --no-fetch upstream/quattro
          if fedora/tests/static.sh >static.log 2>&1; then status="passed"; else status="FAILED"; fi
          git push origin "sync/$SHORT"
          {
            echo "Syncs upstream-owned paths to omacom/omarchy quattro at $SHORT. Static checks: **$status**."
            echo
            echo "Review with fedora/docs/SYNC.md: drifted overrides, rejected patches, new migrations, new packages."
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' static.log | tail -n 80
            echo '```'
          } >body.md
          gh pr create --base main --head "sync/$SHORT" --title "Sync upstream quattro ($SHORT)" --body-file body.md
